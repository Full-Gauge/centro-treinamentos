name: Deploy Worker

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Selecionar config do Wrangler
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "WRANGLER_CONFIG=wrangler.prod.jsonc" >> "$GITHUB_ENV"
          else
            echo "WRANGLER_CONFIG=wrangler.dev.jsonc" >> "$GITHUB_ENV"
          fi

      - name: Deploy para Cloudflare
        run: npx wrangler deploy --config "$WRANGLER_CONFIG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
